# SPDX-License-Identifier: MPL-2.0
[workspace]
resolver = "2"
members = [
    "crates/nightlight-core",
    "crates/nightlight-helper",
    "crates/cosmic-nightlight",
]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MPL-2.0"

[workspace.dependencies]
nightlight-core = { path = "crates/nightlight-core" }
drm = "0.11"
libc = "0.2"
chrono = "0.4"

# Upstream commits that remove affected transitive dependencies.
[patch.crates-io]
xkbcommon = { git = "https://github.com/rust-x-bindings/xkbcommon-rs", rev = "b2b00494ee6714eb042b723a5c07d715be96bfa1" }
zbus_xml = { git = "https://github.com/z-galaxy/zbus", rev = "81674e4e715411b54c78609745281feb4f1249fd" }
