# SPDX-License-Identifier: MPL-2.0
[workspace]
resolver = "2"
exclude = ["vendor/cryoglyph", "vendor/iced_winit", "vendor/xkbcommon", "vendor/zbus_xml", "vendor/iced_tiny_skia", "vendor/metal", "vendor/iced_wgpu", "vendor/build_helpers", "vendor/cosmic-text"]
members = [
    "crates/nightlight-core",
    "crates/nightlight-helper",
    "crates/cosmic-nightlight",
]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MPL-2.0"

[workspace.dependencies]
nightlight-core = { path = "crates/nightlight-core" }
drm = "0.11"
libc = "0.2"
chrono = "0.4"

# Narrow caller patches allow fixed dependency versions without changing the GUI toolkit.
[patch.crates-io]
cosmic-text = { path = "vendor/cosmic-text" }
metal = { path = "vendor/metal" }
zbus_xml = { path = "vendor/zbus_xml" }
xkbcommon = { path = "vendor/xkbcommon" }

[patch."https://github.com/iced-rs/cryoglyph.git"]
cryoglyph = { path = "vendor/cryoglyph" }

[patch."https://github.com/pop-os/libcosmic.git"]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
iced_wgpu = { path = "vendor/iced_wgpu" }
iced_winit = { path = "vendor/iced_winit" }
build_helpers = { path = "vendor/build_helpers" }
